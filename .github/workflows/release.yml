name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build
        run: npx tauri build --features core --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Copy the bundles to stable names so /releases/latest/download/<name> keeps working.
      - name: Collect assets
        shell: bash
        run: |
          mkdir -p out
          B=src-tauri/target/${{ matrix.target }}/release/bundle
          if [ "$RUNNER_OS" = macOS ]; then
            cp "$(ls $B/dmg/*.dmg | head -1)" out/Jot-macos-universal.dmg
            (cd $B/macos && zip -qry ../../../../../../out/Jot-macos-universal.app.zip Jot.app)
          else
            cp "$(ls $B/appimage/*.AppImage | head -1)" out/Jot-linux-x86_64.AppImage
            cp "$(ls $B/deb/*.deb | head -1)" out/Jot-linux-amd64.deb
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: jot-${{ matrix.os }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Jot $TAG" --generate-notes
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" dist/* --clobber
